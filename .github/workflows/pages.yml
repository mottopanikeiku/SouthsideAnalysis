name: Deploy static map to Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Pages must already be enabled with GitHub Actions as its source.
      - uses: actions/configure-pages@v5
        with:
          enablement: false
      - name: Require the generated map assets
        run: |
          test -s site/index.html
          test -s site/styles.css
          test -s site/app.js
          test -s site/data.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
